aid: kyndryl
name: Kyndryl
description: >-
  Kyndryl is a Fortune 500 IT infrastructure services company spun off from
  IBM in 2021. The company designs, builds, manages, and modernizes
  mission-critical technology systems across cloud, mainframe, networking,
  digital workplace, security, applications, data, and AI. Kyndryl operates
  the Kyndryl Bridge integration and observability platform, runs the Kyndryl
  Vital design studios, and partners with hyperscalers including AWS, Azure,
  Google Cloud, and SAP. No public developer API has been documented.
